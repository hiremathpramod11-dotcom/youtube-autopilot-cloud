name: YouTube Perpetual Lifetime Cloud Autopilot

on:
  schedule:
    # Trigger 1: 12:45 PM IST (07:15 UTC) - primary daily production run
    - cron: '15 7 * * *'
    # Trigger 2: 5:15 PM IST (11:45 UTC) - secondary catch-up trigger
    - cron: '45 11 * * *'
    # Trigger 3: 11:45 PM IST (18:15 UTC) - nighttime buffer builder trigger
    - cron: '15 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / mobile anytime

jobs:
  run-daily-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for rebase and keepalive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Python & Edge-TTS in Cloud
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-pip python-is-python3
          pip install edge-tts --break-system-packages || pip install edge-tts

      - name: Restore Cloud Credentials
        env:
          CREDS: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          TOKENS: ${{ secrets.YOUTUBE_TOKENS_JSON }}
        run: |
          node -e "
            const fs = require('fs');
            fs.mkdirSync('config', { recursive: true });
            if (process.env.CREDS && process.env.CREDS.trim().length > 10) {
              fs.writeFileSync('config/credentials.json', process.env.CREDS.trim());
              console.log('✓ Restored credentials.json from GitHub Secrets.');
            }
            if (process.env.TOKENS && process.env.TOKENS.trim().length > 10) {
              fs.writeFileSync('config/tokens.json', process.env.TOKENS.trim());
              console.log('✓ Restored tokens.json from GitHub Secrets.');
            }
          "

      - name: Install Node Dependencies
        run: npm install

      - name: Run Cloud Autopilot (Produce & Schedule Next Days)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMOTIONAL_STORE_URL: ${{ secrets.PROMOTIONAL_STORE_URL || 'https://latinas-plastic-manitoba-handling.trycloudflare.com/' }}
        run: node scripts/cloud-runner.js

      - name: Commit and Push Calendar & Token Updates
        if: always()
        run: |
          git config --global user.name "Kannadiga369-CloudBot"
          git config --global user.email "bot@kannadiga369.com"
          git add data/30_day_calendar.json shadow-print/ || true
          git add -f config/tokens.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: updated YouTube cloud calendar & token state [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin main
          fi

      - name: Prevent GitHub From Disabling Workflow (Lifetime Keepalive)
        uses: gautamkrishnar/keepalive-workflow@v2
        if: always()
        with:
          commit_message: "chore: automated lifetime keepalive [skip ci]"
